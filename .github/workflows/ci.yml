name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for GITHUB_TOKEN: CI only reads the repository
permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz from the release's checksums.txt.
  # Update both together: a mismatch fails the scan step instead of running an unexpected binary.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # gitleaks-action requires a license for organization accounts, so use the
      # binary directly to make sure it also works in private repositories.
      - name: gitleaks scan
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks && rm gitleaks.tar.gz
          ./gitleaks dir . --no-banner --redact --verbose

      - name: npm audit
        run: npm audit --audit-level=low

      # Check for leaked real data. CI has no *.local.json, so here it can only
      # verify that the script is not broken. The real protection is passing
      # `npm run check:pii` locally (see AGENTS.md).
      - name: Real-data leak check (script health only)
        run: npm run check:pii

      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      # UI layer (components/routes) on jsdom with Testing Library; server functions are mocked
      - run: npm run test:ui:coverage
      # Server-layer tests against the real Workers runtime + D1
      - run: npm run test:server
      # Tests for scripts/lib (the pure part of importing case-sheet JSON into D1)
      - run: npm run test:scripts
      - run: npm run build

      # Prevents schema changes and migrations from getting out of sync.
      # Fails here if schema.ts was changed but db:generate was forgotten.
      - name: drizzle migrations are up to date
        run: |
          npm run db:generate -- --name ci_check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::schema.ts changed but no migration was generated. Run 'npm run db:generate' and commit the result."
            git status --porcelain drizzle
            exit 1
          fi
